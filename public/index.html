<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample status</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#eef1f6;color:#111}
@media(prefers-color-scheme:dark){body{background:#14171c;color:#eee}input{background:#1d2128;color:#eee}}
main{width:min(92vw,420px)}h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:#667}
form{display:flex;gap:8px}input{flex:1;min-width:0;padding:14px;border:1.5px solid #8893a5;border-radius:10px;font:inherit;text-transform:uppercase}
button{padding:0 20px;border:0;border-radius:10px;background:#4472c4;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9bb6ea;outline-offset:2px}</style></head>
<body><main><h1>Sample status</h1><p>Enter a sample JC number, for example S171.</p>
<form onsubmit="event.preventDefault();var v=this.jc.value.trim();if(v)location.href='/'+encodeURIComponent(v)"><input name="jc" placeholder="JC number" autocomplete="off" autofocus aria-label="Sample JC number"><button>Open</button></form></main></body></html>
